global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    platform: ainterview

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]
        labels:
          service: backend

  - job_name: algorithm-judge-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["algorithm-judge-worker:8085"]
        labels:
          service: algorithm-judge-worker

  - job_name: cloud-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cloud-gateway:8083"]
        labels:
          service: cloud-gateway

  - job_name: cloud-registry
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cloud-registry:8761"]
        labels:
          service: cloud-registry
