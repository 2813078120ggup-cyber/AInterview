global:
  resolve_timeout: 5m

route:
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

# Deliberately no external notification credentials are stored in the repository.
# Configure an email, webhook, or enterprise notification receiver through the
# deployment environment before enabling production alert delivery.
receivers:
  - name: default
