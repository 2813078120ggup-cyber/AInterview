services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_interview}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_USER: ${MYSQL_APP_USER:-ai_interview_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be set in .env}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  cloud-registry:
    build:
      context: ./cloud-registry
    restart: unless-stopped
    environment:
      SERVER_PORT: 8761
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8761/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    expose:
      - "8761"
    networks:
      - private

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # API backend 不挂载 Docker Socket；判题 Socket 只授予下方独立 Worker。
    # 当前保留容器内 root 以兼容既有媒体卷权限，后续可单独收紧。
    user: "0:0"
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: backend-core
      SPRING_CLOUD_DISCOVERY_ENABLED: ${SPRING_CLOUD_DISCOVERY_ENABLED:-true}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-true}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://cloud-registry:8761/eureka/}
      EUREKA_FETCH_REGISTRY: ${EUREKA_FETCH_REGISTRY:-true}
      EUREKA_INSTANCE_HOSTNAME: backend
      EUREKA_INSTANCE_ID: backend:8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ai_interview}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${MYSQL_APP_USER:-ai_interview_app}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      APP_REQUIRE_STRONG_JWT_SECRET: ${APP_REQUIRE_STRONG_JWT_SECRET:-true}
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      AUTH_RATE_LIMIT_LOGIN_PER_MINUTE: ${AUTH_RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      AUTH_RATE_LIMIT_REGISTER_PER_MINUTE: ${AUTH_RATE_LIMIT_REGISTER_PER_MINUTE:-5}
      AUTH_RATE_LIMIT_CODE_SEND_PER_MINUTE: ${AUTH_RATE_LIMIT_CODE_SEND_PER_MINUTE:-3}
      AUTH_RATE_LIMIT_CODE_SEND_PER_DAY: ${AUTH_RATE_LIMIT_CODE_SEND_PER_DAY:-20}
      AUTH_RATE_LIMIT_LOGIN_CODE_PER_MINUTE: ${AUTH_RATE_LIMIT_LOGIN_CODE_PER_MINUTE:-10}
      ALGORITHM_JUDGE_ENABLED: ${ALGORITHM_JUDGE_ENABLED:-true}
      ALGORITHM_JUDGE_WORKER_BASE_URL: ${ALGORITHM_JUDGE_WORKER_BASE_URL:-http://algorithm-judge-worker:8084/api}
      ALGORITHM_JUDGE_WORKER_SERVICE_ID: ${ALGORITHM_JUDGE_WORKER_SERVICE_ID:-algorithm-judge-worker}
      ALGORITHM_JUDGE_WORKER_DISCOVERY_ENABLED: ${ALGORITHM_JUDGE_WORKER_DISCOVERY_ENABLED:-true}
      ALGORITHM_JUDGE_WORKER_SERVICE_PATH: ${ALGORITHM_JUDGE_WORKER_SERVICE_PATH:-/api}
      ALGORITHM_JUDGE_WORKER_CONNECT_TIMEOUT_MS: ${ALGORITHM_JUDGE_WORKER_CONNECT_TIMEOUT_MS:-2000}
      ALGORITHM_JUDGE_WORKER_READ_TIMEOUT_MS: ${ALGORITHM_JUDGE_WORKER_READ_TIMEOUT_MS:-30000}
      ALGORITHM_JUDGE_WORKER_CIRCUIT_BREAKER_NAME: ${ALGORITHM_JUDGE_WORKER_CIRCUIT_BREAKER_NAME:-algorithmJudgeWorker}
      ALGORITHM_JUDGE_WORKER_BULKHEAD_MAX_CONCURRENT: ${ALGORITHM_JUDGE_WORKER_BULKHEAD_MAX_CONCURRENT:-8}
      ALGORITHM_JUDGE_WORKER_BULKHEAD_MAX_WAIT_MS: ${ALGORITHM_JUDGE_WORKER_BULKHEAD_MAX_WAIT_MS:-0}
      ALGORITHM_JUDGE_INTERNAL_TOKEN: ${ALGORITHM_JUDGE_INTERNAL_TOKEN:-}
      ALGORITHM_JUDGE_INTERNAL_TOKEN_FILE: ${ALGORITHM_JUDGE_INTERNAL_TOKEN_FILE:-/run/secrets/algorithm-judge-internal-token}
      ALGORITHM_JUDGE_REQUIRE_INTERNAL_TOKEN: ${ALGORITHM_JUDGE_REQUIRE_INTERNAL_TOKEN:-false}
      APP_SECRETS_DIRECTORY: ${APP_SECRETS_DIRECTORY:-/run/secrets/}
      CLAMAV_REQUIRED: ${CLAMAV_REQUIRED:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-104857600}
      MEDIA_MAX_UPLOAD_SIZE: ${MEDIA_MAX_UPLOAD_SIZE:-100MB}
      MEDIA_MAX_REQUEST_SIZE: ${MEDIA_MAX_REQUEST_SIZE:-105MB}
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-8081}
      DEEPSEEK_ENABLED: ${DEEPSEEK_ENABLED:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      AI_TASK_POLL_INTERVAL_MS: ${AI_TASK_POLL_INTERVAL_MS:-1000}
      AI_TASK_SCHEDULER_ENABLED: ${AI_TASK_SCHEDULER_ENABLED:-true}
      AI_TASK_FETCH_LIMIT: ${AI_TASK_FETCH_LIMIT:-12}
      AI_TASK_WORKER_COUNT: ${AI_TASK_WORKER_COUNT:-3}
      AI_TASK_WORKER_QUEUE_CAPACITY: ${AI_TASK_WORKER_QUEUE_CAPACITY:-50}
      REPORT_SCORING_CONCURRENCY: ${REPORT_SCORING_CONCURRENCY:-3}
      REPORT_SCORING_QUEUE_CAPACITY: ${REPORT_SCORING_QUEUE_CAPACITY:-50}
      REGISTER_SMS_HOST: ${REGISTER_SMS_HOST:-https://dfsns.market.alicloudapi.com}
      REGISTER_SMS_PATH: ${REGISTER_SMS_PATH:-/data/send_sms}
      REGISTER_SMS_APP_CODE: ${REGISTER_SMS_APP_CODE:-}
      REGISTER_SMS_TEMPLATE_ID: CST_ptdie100
      MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME:-}}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
      REGISTER_CODE_MAIL_SUBJECT: ${REGISTER_CODE_MAIL_SUBJECT:-AInterview 验证码}
      OPENTALKING_UPSTREAM: ${OPENTALKING_UPSTREAM:-host.docker.internal:8210}
      MEDIA_STORAGE_ROOT: /app/data/media
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/data/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      cloud-registry:
        condition: service_healthy
      algorithm-judge-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:$${MANAGEMENT_PORT:-8081}/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    expose:
      - "8080"
      - "8081"
    networks:
      - private

  algorithm-judge-worker:
    image: ainterview-algorithm-judge-worker
    build:
      context: ./algorithm-judge-worker
    restart: unless-stopped
    # 判题 Worker 是唯一允许访问宿主机 Docker Socket 的 AInterview 服务。
    user: "0:0"
    environment:
      SERVER_PORT: 8084
      MANAGEMENT_PORT: 8085
      SPRING_APPLICATION_NAME: algorithm-judge-worker
      SPRING_CLOUD_DISCOVERY_ENABLED: ${SPRING_CLOUD_DISCOVERY_ENABLED:-true}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-true}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://cloud-registry:8761/eureka/}
      EUREKA_INSTANCE_HOSTNAME: algorithm-judge-worker
      EUREKA_FETCH_REGISTRY: ${EUREKA_FETCH_REGISTRY:-false}
      EUREKA_REGISTER_WITH_EUREKA: ${EUREKA_REGISTER_WITH_EUREKA:-true}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ai_interview}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${MYSQL_APP_USER:-ai_interview_app}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      ALGORITHM_JUDGE_ENABLED: ${ALGORITHM_JUDGE_ENABLED:-true}
      ALGORITHM_JUDGE_CONSUMER_ENABLED: ${ALGORITHM_JUDGE_WORKER_CONSUMER_ENABLED:-true}
      ALGORITHM_JUDGE_RUNNER_IMAGE: ${ALGORITHM_JUDGE_RUNNER_IMAGE:-ai-java17-runner:2.0}
      ALGORITHM_JUDGE_DOCKER_HOST: ${ALGORITHM_JUDGE_DOCKER_HOST:-unix:///var/run/docker.sock}
      ALGORITHM_JUDGE_INTERNAL_TOKEN: ${ALGORITHM_JUDGE_INTERNAL_TOKEN:-}
      ALGORITHM_JUDGE_INTERNAL_TOKEN_FILE: ${ALGORITHM_JUDGE_INTERNAL_TOKEN_FILE:-/run/secrets/algorithm-judge-internal-token}
      ALGORITHM_JUDGE_REQUIRE_INTERNAL_TOKEN: ${ALGORITHM_JUDGE_REQUIRE_INTERNAL_TOKEN:-false}
      AI_TASK_SCHEDULER_ENABLED: false
      TZ: Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      cloud-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:$${MANAGEMENT_PORT:-8085}/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    expose:
      - "8084"
      - "8085"
    networks:
      - private

  cloud-gateway:
    build:
      context: ./cloud-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      MANAGEMENT_PORT: 8083
      SPRING_CLOUD_DISCOVERY_ENABLED: true
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://cloud-registry:8761/eureka/}
      EUREKA_INSTANCE_HOSTNAME: cloud-gateway
      EUREKA_INSTANCE_ID: cloud-gateway:8082
      TZ: Asia/Shanghai
    depends_on:
      cloud-registry:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:$${MANAGEMENT_PORT:-8083}/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    expose:
      - "8082"
      - "8083"
    networks:
      - private

  frontend:
    build:
      context: ./frontend-react
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENTALKING_UPSTREAM: ${OPENTALKING_UPSTREAM:-host.docker.internal:8210}
      API_UPSTREAM: ${API_UPSTREAM:-cloud-gateway:8082}
      GRAFANA_UPSTREAM: ${GRAFANA_UPSTREAM:-grafana:3000}
    depends_on:
      backend:
        condition: service_healthy
      cloud-gateway:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - private

  java-runner:
    image: ai-java17-runner:2.0
    build:
      context: ./runner-images/java17
    profiles: ["judge"]
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      algorithm-judge-worker:
        condition: service_healthy
      cloud-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - private

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./ops/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/ready > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - private

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-production}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./ops/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks:
      - private

volumes:
  mysql_data:
  redis_data:
  media_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  private:
    driver: bridge
